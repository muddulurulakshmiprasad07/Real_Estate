<!DOCTYPE html>
<html>
<head>
    <title>User Login</title>
    <style>
        body {
            font-family: Arial;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            padding: 50px;
        }
        .container {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 12px;
        }
        input {
            width: 95%;
            padding: 10px;
            margin: 8px 0;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #176b50;
            color: white;
            border: 0;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Welcome Back</h2>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Login</button>
    </form>

    <p>New user?
        <a href="{% url 'register' %}">Create Account</a>
    </p>
</div>
</body>
</html>
